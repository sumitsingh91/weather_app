<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <!-- Connect CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="weather-app">

        <h1>Weather App</h1>

        <!-- Search Box -->
        <div class="search-box">

            <input
                type="text"
                id="cityInput"
                placeholder="Enter city name"
            >

            <button id="searchBtn">
                Search
            </button>

        </div>

        <!-- Weather Card -->
        <div class="weather-card">

            <h2 id="cityName">New Delhi</h2>

            <p id="date">Loading...</p>

            <!-- Weather Icon -->
            <div class="weather-icon" id="weatherIcon">
                ☀️
            </div>

            <!-- Temperature -->
            <h3 id="temperature">--°C</h3>

            <!-- Weather Description -->
            <p id="description">Loading...</p>

            <!-- Weather Details -->
            <div class="weather-details">

                <div>
                    <span>💧</span>
                    <p>Humidity</p>
                    <strong id="humidity">--%</strong>
                </div>

                <div>
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <strong id="wind">-- km/h</strong>
                </div>

                <div>
                    <span>🌡️</span>
                    <p>Feels Like</p>
                    <strong id="feelsLike">--°C</strong>
                </div>

            </div>

        </div>

    </div>

    <!-- Connect JavaScript file -->
    <script src="script.js"></script>

</body>
</html>
